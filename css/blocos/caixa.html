<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
 <style>
#caixa1 {
    background-color: rgb(114, 27, 27);
    width: 300px;
    padding: 50px;
    margin: 25px;
    border: 25px solid green;
    float:left;
 
}
#caixa2 {
    background-color: rgb(32, 13, 100);
    max-width: 500px;
    padding: 50px;
    margin: 25px;
    border: 25px solid green;
    float:left;
    
 
}

.relative1 { 
    position: relative; 
    border: 25px solid green;
} 
.relative2 { 
      position: relative; 
      top: 20px;
      left: 20px; 
      background-color: black; 
      width: 500px;  color:white;
      border: 25px solid green;
}

.fixed{
    position: fixed; 
      bottom: 20px;
      left: 20px; 
      background-color: black; 
      width: 500px;  color:white;
      border: 25px solid green;
}

</style>
</head>
<body>
<h2>Demonstrando the Box Model</h2><!--
<div id="caixa1">O texto é o conteúdo da caixa. Nós adicionamos 25px de padding, 25px de margin e uma borda verde de 25px. 
</div>
<div id="caixa2">
O texto é o conteúdo da caixa. Nós adicionamos 25px de padding, 25px de margin e uma borda verde de 25px. 

</div>-->
<div class="relative1">relative1</div>
<div class="relative2">relative2</div>
<div class="fixed">fixed</div>

</body>
</html>
