<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="">
        <label>Nome:</label>
        <input type="text" name="nome" maxlength="10" placeholder="Digite seu nome"
        value="Fernanda">
        <br>
        <label>Senha:</label>
        <input type="password" name="senha" placeholder="Digite uma senha"> 
        <br>
        Opinião:<br>
        <textarea name="opiniao" cols="50" rows="10"></textarea>

        <br>
        <select name="estados">
            <option value="RS">RS</option>
            <option value="SC" selected>SC</option>
            <option value="PR">PR</option>
        </select>
        <br>
        Idiomas:
        <input type="checkbox" name="idioma1" value="Inglês">Inglês
        <input type="checkbox" name="idioma2" value="Espanhol">Espanhol
        <input type="checkbox" name="idioma3" value="Francês">Francês

        <br>

        Você gosta de estudar?
        <input type="radio" name="estudar" value="Sim" checked>Sim
        <input type="radio" name="estudar" value="Não">Não

       <br>

        <fieldset>
              <legend>Dados pessoais:</legend>
                Nome: <input type="text" name="nome"><br>
                Email: <input type="email" name="email"><br>
                Nascimento: <input type="date" name="nascimento">

        </fieldset>


        <input type="submit" value="Enviar" name="Enviar">
        <input type="reset" value="Limpar" name="Limpar">

    </form>
    
</body>
</html>
