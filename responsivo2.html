<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-family: "Lucida Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .header {

            padding: 15px;
            background-color: #9933cc;
            color: #ffffff;

        }

        .row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        [class*="col-"] {

            padding: 15px;
            border: 1px solid red;
        }

        .col-1 {
            width: 16.66%;
        }

        .col-2 {
            width: 16.66%;
        }

        .col-3 {
            width: 16.66%;
        }

        .col-4 {
            width: 16.66%;
        }

        .col-5 {
            width: 16.66%
        }

        .col-6 {
            width: 16.66%
        }

        @media only screen and (max-width: 500px) {

            /* For desktop: */
            [class*="col-"] {
                Width: 100%;
            }

        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Chania</h1>
    </div>
    <div class="row">
        <div class="col-1"> 1 </div>
        <div class="col-2"> 2 </div>
        <div class="col-3"> 3 </div>
        <div class="col-4"> 4 </div>
        <div class="col-5"> 5 </div>
        <div class="col-6"> 6 </div>


    </div>


</body>

</html>
